[package]
name = "px1-core"
version = "0.1.0"
edition = "2021"
description = "Lossless PX1 disc container engine without desktop or network dependencies"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
zstd = "0.13"
chrono = { version = "0.4", features = ["serde", "clock"] }

[dev-dependencies]
tempfile = "3"
